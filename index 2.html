<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf1e6">
<title>happy boyfriend dayyy Tanmayyy 🥹💗</title>
<style>
:root{
  --cream:#fbf1e6; --blush:#f4d3cf; --pink:#d79aa0; --rose:#b9646f;
  --brown:#7a5648; --ink:#5a3e34; --paper:#fffaf3;
  --hand:"Bradley Hand","Segoe Print","Marker Felt","Comic Sans MS","Chalkboard SE",cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);font-family:var(--hand);overflow-x:hidden;
  background:linear-gradient(160deg,#fbf1e6,#f7dcd6,#f1d0cf,#fbf1e6);
  background-size:300% 300%;animation:drift 22s ease-in-out infinite;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
@keyframes drift{0%,100%{background-position:0% 30%}50%{background-position:100% 70%}}

/* floating bits */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.fh{position:absolute;bottom:-40px;opacity:0;animation:rise linear forwards}
@keyframes rise{
  0%{transform:translateY(0) translateX(0) rotate(-8deg);opacity:0}
  10%{opacity:.75}
  50%{transform:translateY(-55vh) translateX(18px) rotate(8deg)}
  100%{transform:translateY(-115vh) translateX(-14px) rotate(-6deg);opacity:0}
}
.sp{position:absolute;animation:twinkle 1.8s ease-in-out forwards}
@keyframes twinkle{0%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(25deg)}100%{opacity:0;transform:scale(.4) rotate(50deg)}}
.bh{position:fixed;z-index:50;pointer-events:none;will-change:transform,opacity}

main{position:relative;z-index:2}

/* hero */
.hero{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.bigheart{font-size:92px;line-height:1;animation:beat 1.1s ease-in-out infinite;filter:drop-shadow(0 6px 14px rgba(185,100,111,.35))}
.bigheart.pop{animation:pop .7s ease-out forwards}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(0);opacity:0}}
.hero h1{font-weight:400;font-size:clamp(34px,10.5vw,60px);line-height:1.15;margin:8px 0 6px;color:var(--rose);opacity:0;transform:scale(.96);transition:opacity 1.6s ease,transform 1.6s ease;text-shadow:2px 2px 0 rgba(255,255,255,.7)}
.hero .sub{font-size:20px;color:var(--brown);opacity:0;transition:opacity 1.6s ease 1s}
.hero.in h1,.hero.in .sub,.hero.in .cue{opacity:1;transform:none}
.cue{margin-top:34px;border:0;background:none;font:inherit;font-size:18px;color:var(--brown);opacity:0;transition:opacity 1.4s ease 2s;cursor:pointer;padding:10px}
.cue span{display:block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}

/* letter */
.wrap{max-width:560px;margin:0 auto;padding:30px 18px 10px}
.paper{
  position:relative;background-color:var(--paper);border-radius:6px;
  padding:34px 24px 26px 46px;transform:rotate(-.6deg);
  box-shadow:0 2px 0 rgba(122,86,72,.08),0 14px 30px rgba(122,86,72,.18);
  background-image:linear-gradient(90deg,transparent 33px,rgba(215,154,160,.7) 33px,rgba(215,154,160,.7) 35px,transparent 35px),
    repeating-linear-gradient(to bottom,transparent 0,transparent 31px,rgba(122,86,72,.14) 31px,rgba(122,86,72,.14) 32px);
  background-position:0 0,0 14px;
}
.paper::before,.paper::after{content:"";position:absolute;width:86px;height:26px;background:rgba(215,154,160,.5);top:-12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.paper::before{left:18px;transform:rotate(-6deg)}
.paper::after{right:18px;transform:rotate(5deg);background:rgba(240,206,160,.55)}
.para{margin:0 0 32px}
.para:last-child{margin-bottom:0}
.line{display:block;font-size:20px;line-height:32px;opacity:0;transform:translateY(8px);transition:opacity 1s ease,transform 1s ease}
.para.show .line{opacity:1;transform:none}
.para.big .line{font-size:22px;color:var(--rose)}

/* polaroids */
.polas{display:grid;grid-template-columns:1fr 1fr;gap:26px 16px;padding:52px 4px 10px;max-width:460px;margin:0 auto}
.pola{margin:0;background:#fffdf9;padding:8px 8px 6px;box-shadow:0 8px 18px rgba(122,86,72,.25);position:relative;opacity:0;transform:rotate(var(--r)) translateY(22px) scale(.95);transition:opacity .9s ease,transform .9s ease;cursor:pointer}
.pola.show{opacity:1;transform:rotate(var(--r))}
.pola:nth-child(even){margin-top:22px}
.pola img{display:block;width:100%;height:clamp(170px,50vw,250px);object-fit:cover;object-position:50% 25%;background:var(--blush)}
.pola figcaption{font-size:15px;text-align:center;padding:9px 0 5px;color:var(--brown)}
.pola::before{content:"";position:absolute;top:-10px;left:50%;width:42px;height:16px;margin-left:-21px;background:rgba(215,154,160,.55);transform:rotate(-4deg)}
.pola:nth-child(3n+2)::before{background:rgba(240,206,160,.6)}
#lb{position:fixed;inset:0;z-index:100;background:rgba(90,62,52,.82);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s ease}
#lb.on{opacity:1;pointer-events:auto}
#lb img{max-width:100%;max-height:86vh;max-height:86dvh;border:10px solid #fffdf9;border-bottom-width:38px;box-shadow:0 12px 40px rgba(0,0,0,.4);transform:rotate(-1.5deg)}

/* button */
.btnbox{text-align:center;padding:52px 18px 10px}
.btn{
  font:inherit;font-size:21px;color:#fff;background:linear-gradient(135deg,#d98f98,#b9646f);
  border:0;border-radius:999px;padding:15px 30px;cursor:pointer;
  box-shadow:0 8px 20px rgba(185,100,111,.4);animation:nudge 2.6s ease-in-out infinite;
  transition:transform .2s ease;
}
.btn:active{transform:scale(.94)}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.06) rotate(-1deg)}}
.btn.done{animation:none;opacity:.7}
.reveal{margin:26px auto 0;max-width:340px;background:var(--paper);padding:20px 18px;border-radius:4px;font-size:23px;line-height:1.4;color:var(--rose);box-shadow:0 10px 24px rgba(122,86,72,.22);transform:rotate(1.5deg) scale(.6);opacity:0;pointer-events:none;transition:opacity .5s ease,transform .6s cubic-bezier(.3,1.6,.5,1)}
.reveal.on{opacity:1;transform:rotate(1.5deg) scale(1)}

/* ending */
.end{text-align:center;padding:90px 20px calc(80px + env(safe-area-inset-bottom))}
.glow{font-size:78px;line-height:1;animation:glow 2.4s ease-in-out infinite;display:inline-block}
@keyframes glow{0%,100%{transform:scale(1);filter:drop-shadow(0 0 8px rgba(215,110,125,.5))}50%{transform:scale(1.12);filter:drop-shadow(0 0 26px rgba(230,100,120,.95))}}
.still{font-size:36px;color:var(--rose);margin:14px 0 22px}
.load{font-size:19px;color:var(--brown)}
.dots span{display:inline-block;animation:dot 1.4s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.bar{width:150px;height:8px;border-radius:99px;background:rgba(215,154,160,.35);margin:16px auto 0;overflow:hidden}
.bar div{height:100%;width:30%;border-radius:99px;background:var(--pink);animation:slide 2.4s ease-in-out infinite}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}
</style>
</head>

  <section class="end">
    <div class="glow">💗</div>
    <div class="still">still usss ♡</div>
    <div class="load">more memories loadinggg… 🥹✨</div>
    <div class="bar"><div></div></div>
  </section>
</main>

<script>
(function(){
  var fx=document.getElementById('fx');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* the letter, one array item per paragraph, one string per line */
  var letter=[
    {big:1,l:["happy boyfriend dayyy to my favourite personnn 🥹💗"]},
    {l:["idkk how to explain how much you mean to meee","but you’ve become such a huge part of my lifeee 😭🫶🏻"]},
    {l:["from our school days","to walking home together","to our stupid little conversations","to your hoodieee","to all those tiny memories that somehow became my favourite ones 🥹"]},
    {l:["you’ve given me sooo many moments I’ll always rememberrr","and honestlyyy I’m just really happy that it’s YOUUU 💗"]},
    {l:["I hope we both grow up","become successful","make our families proud","and still have each other to celebrate every little winnn ✨"]},
    {l:["and somedayyy…","I hope we look back at this website and laugh because we were just two school kids who had no idea how much life was waiting for us 😭"]},
    {big:1,l:["happy boyfriend dayyy Tanmayyy 🥹💍","I love our little storyyy","and I’m sooo excited for all the memories we haven’t made yettt 🫶🏻💗"]}
  ];
  var paper=document.getElementById('paper');
  letter.forEach(function(p){
    var d=document.createElement('p');d.className='para'+(p.big?' big':'');
    p.l.forEach(function(t,i){
      var s=document.createElement('span');s.className='line';s.textContent=t;
      s.style.transitionDelay=(i*0.7)+'s';d.appendChild(s);
    });
    paper.appendChild(d);
  });

  /* reveal on scroll */
  function watch(sel){
    var els=document.querySelectorAll(sel);
    if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('show')});return}
    var io=new IntersectionObserver(function(en){
      en.forEach(function(x){if(x.isIntersecting){x.target.classList.add('show');io.unobserve(x.target)}});
    },{threshold:.35});
    els.forEach(function(e){io.observe(e)});
  }
  watch('.para');watch('.pola');
  var lb=document.getElementById('lb'),lbi=lb.querySelector('img');
  document.querySelectorAll('.pola').forEach(function(f){
    f.addEventListener('click',function(){lbi.src=f.querySelector('img').src;lb.classList.add('on')});
  });
  lb.addEventListener('click',function(){lb.classList.remove('on')});

  /* heart burst (Web Animations API) */
  var emo=['💗','💕','🩷','✨','💖','🤍'];
  function burst(x,y,n){
    if(reduce||!Element.prototype.animate)return;
    for(var i=0;i<n;i++){
      var h=document.createElement('div');h.className='bh';
      h.textContent=emo[Math.floor(Math.random()*emo.length)];
      h.style.left=x+'px';h.style.top=y+'px';
      h.style.fontSize=(14+Math.random()*22)+'px';
      document.body.appendChild(h);
      var a=Math.random()*Math.PI*2,r=90+Math.random()*170;
      var dx=Math.cos(a)*r,dy=Math.sin(a)*r-40;
      var an=h.animate([
        {transform:'translate(-50%,-50%) scale(.2)',opacity:1},
        {transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px)) scale(1.1) rotate('+(Math.random()*60-30)+'deg)',opacity:1,offset:.7},
        {transform:'translate(calc(-50% + '+dx*1.1+'px),calc(-50% + '+(dy+40)+'px)) scale(.9)',opacity:0}
      ],{duration:1400+Math.random()*600,easing:'cubic-bezier(.2,.8,.3,1)'});
      an.onfinish=(function(el){return function(){el.remove()}})(h);
    }
  }

  /* opening sequence */
  var hero=document.getElementById('hero'),bh=document.getElementById('bigheart');
  setTimeout(function(){
    var r=bh.getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2,34);
    bh.classList.add('pop');
    hero.classList.add('in');
  },1500);

  /* floating hearts + sparkles */
  var fl=['💗','💕','🩷','🤍','♡'];
  function floater(){
    if(document.hidden||fx.children.length>26)return;
    var h=document.createElement('div');h.className='fh';
    h.textContent=fl[Math.floor(Math.random()*fl.length)];
    h.style.left=(Math.random()*94)+'vw';
    h.style.fontSize=(13+Math.random()*20)+'px';
    h.style.animationDuration=(9+Math.random()*8)+'s';
    fx.appendChild(h);setTimeout(function(){h.remove()},18000);
  }
  function sparkle(){
    if(document.hidden)return;
    var s=document.createElement('div');s.className='sp';
    s.textContent=Math.random()<.5?'✨':'✦';
    s.style.left=(Math.random()*95)+'vw';s.style.top=(Math.random()*92)+'vh';
    s.style.fontSize=(10+Math.random()*12)+'px';
    s.style.color='#e5a9ae';
    fx.appendChild(s);setTimeout(function(){s.remove()},1900);
  }
  if(!reduce){
    setTimeout(function(){setInterval(floater,1100);setInterval(sparkle,650)},1800);
  }

  /* scroll cue */
  document.getElementById('cue').addEventListener('click',function(){
    var t=document.querySelector('.wrap');
    if(t.scrollIntoView)t.scrollIntoView({behavior:'smooth',block:'start'});
  });

  /* the button */
  var btn=document.getElementById('btn'),rev=document.getElementById('reveal');
  btn.addEventListener('click',function(e){
    var r=btn.getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2,26);
    rev.classList.add('on');btn.classList.add('done');
    setTimeout(function(){
      if(rev.scrollIntoView)rev.scrollIntoView({behavior:'smooth',block:'center'});
    },250);
  });
})();
</script>
</body>
</html>
